    <main class="contact-form">
        <h1>Contact Form</h1>

        <form action="https://httpbin.org/post" method="post">
            <label for="name">Name (required)</label>
            <input type="text" id="name" name="name" autocomplete="name" required minlength="1" maxlength="100">
            <label for="email">Email (required)</label>
            <input type="email" id="email" name="email" autocomplete="email" required>
            <label for="comments">Comments (required)</label>
            <p class="hint" id="comments-hint">Must be between 10 and 1000 characters</p>
            <textarea name="comments" id="comments" required minlength="10" maxlength="1000" aria-describedby="comments-hint"></textarea>
            <input type="hidden" name="possible_bot" value="true">
            <button type="submit">Submit</button>
        </form>
    </main>
</body>
</html>
