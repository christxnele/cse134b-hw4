      <a href="index.html">Christine Le</a>
      <nav>
        <ul class="header-links">

        </ul>
      </nav>
    </header>

    <main class="contact-form">
      <h1>Contact Form</h1>

      <form class="form" action="https://httpbin.org/post" method="post">
        <label for="name">Name (required)</label>
        <input
          type="text"
          id="name"
          name="name"
          autocomplete="name"
          required
          minlength="1"
          maxlength="100"
        />
        <label for="email">Email (required)</label>
        <input
          type="email"
          id="email"
          name="email"
          autocomplete="email"
          required
        />
        <label for="comments">Comments (required)</label>
        <p class="hint" id="comments-hint">
          Must be between 10 and 1000 characters
        </p>
        <textarea
          name="comments"
          id="comments"
          required
          minlength="10"
          maxlength="1000"
          aria-describedby="comments-hint info-message"
        ></textarea>
        <div class="error" hidden aria-live="polite">
            <h2>Error:</h2>
            <ul id="error-message"></ul>
        </div>
        <div class="information" hidden aria-live="polite">
            <h2>Information:</h2>
            <p id="info-message"></p>
            <progress id="char-progress" value="0" max="1000" aria-label="Characters used"></progress>
        </div>
       
        <input type="hidden" name="possible_bot" value="true" />
        <input type="hidden" name="form-errors" id="form-errors">
        <button type="submit">Submit</button>
      </form>
    </main>
  </body>
</html>
