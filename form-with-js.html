<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Form</title>
    <link rel="stylesheet" href="style.css" />
    <!-- no defer: applies the saved theme before the page paints -->
    <script src="theme.js"></script>
    <script src="form.js" defer></script>
  </head>
  <body>
    <header class="nav">
      <a href="index.html">Christine Le</a>
      <nav>
        <ul class="header-links">
          <li><a href="projects.html">Projects</a></li>
          <li><a href="experience.html">Experience</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html">Contact</a></li>
          <li>
            <a href="form-no-js.html"
              >Form (NO JS)</a
            >
          </li>
          <li><a href="form-with-js.html" class="active" aria-current="page">Form (w/ JS)</a></li>
          <li>
            <a
              class="resume-link"
              href="files/Christine_Le_Resume.pdf"
              target="_blank"
              rel="noopener noreferrer"
              >Resume</a
            >
          </li>
          <li class="theme-item" hidden>
            <button
              type="button"
              id="theme-toggle"
              class="theme-toggle"
              aria-label="Dark theme"
              aria-pressed="false"
              title="Toggle dark theme"
            >
              <!-- moon: shown in light theme -->
              <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
              </svg>
              <!-- sun: shown in dark theme -->
              <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <circle cx="12" cy="12" r="4" />
                <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
              </svg>
            </button>
          </li>
        </ul>
      </nav>
    </header>

    <main class="contact-form">
      <h1>Contact Form</h1>

      <form class="form" action="https://httpbin.org/post" method="post">
        <label for="name">Name (required)</label>
        <input
          type="text"
          id="name"
          name="name"
          autocomplete="name"
          required
          minlength="1"
          maxlength="100"
        />
        <label for="email">Email (required)</label>
        <input
          type="email"
          id="email"
          name="email"
          autocomplete="email"
          required
        />
        <label for="comments">Comments (required)</label>
        <p class="hint" id="comments-hint">
          Must be between 10 and 1000 characters
        </p>
        <textarea
          name="comments"
          id="comments"
          required
          minlength="10"
          maxlength="1000"
          aria-describedby="comments-hint info-message"
        ></textarea>
        <div class="error" hidden aria-live="polite">
            <h2>Error:</h2>
            <ul id="error-message"></ul>
        </div>
        <div class="information" hidden aria-live="polite">
            <h2>Information:</h2>
            <p id="info-message"></p>
            <progress id="char-progress" value="0" max="1000" aria-label="Characters used"></progress>
        </div>
       
        <input type="hidden" name="possible_bot" value="true" />
        <input type="hidden" name="form-errors" id="form-errors">
        <button type="submit">Submit</button>
      </form>
    </main>
  </body>
</html>
